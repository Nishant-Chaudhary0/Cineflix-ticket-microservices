user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    sendfile    on;
    keepalive_timeout  65;


    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    upstream auth_service {
        server auth-service:3001;
        keepalive 32;
    }

    upstream booking_service {
        server booking-service:3002;
        keepalive 32;
    }

    upstream payment_service {
        server payment-gateway:3003;
        keepalive 32;
    }


    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Health check — no rate limit, useful for LB/K8s probes
        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Auth routes — stricter limit (protects login/register from brute force)
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_service/;
        }

        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_service;
        }

        location /api/bookings/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://booking_service/;
        }

        location /api/v1/bookings/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://booking_service;
        }

        location /api/payments/ {
            limit_req zone=general_limit burst=10 nodelay;
            proxy_pass http://payment_service/;
        }

        location /api/v1/payments/ {
            limit_req zone=general_limit burst=10 nodelay;
            proxy_pass http://payment_service;
        }

        location /api/tickets/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://ticket_service/;
        }

        location /api/notifications/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://notification_service/;
        }

        # Clean JSON instead of nginx's default HTML error page
        error_page 429 = @rate_limited;
        location @rate_limited {
            add_header Content-Type application/json always;
            return 429 '{"error":"too_many_requests","message":"Rate limit exceeded, please slow down"}';
        }
    }
}